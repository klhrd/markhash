<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MarkHash</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./images/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./images/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MarkHash">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1f2937">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">

    <!-- SEO / sharing -->
    <meta name="description" content="Lightweight Markdown editor PWA. Content lives entirely in the URL hash — no database, share the link itself.">
    <meta property="og:title" content="MarkHash">
    <meta property="og:description" content="Lightweight Markdown PWA with live preview, KaTeX math and URL-hash sharing.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./images/icons/icon-1024.png">

    <!-- 核心工具與樣式（KaTeX / github-markdown CSS 已內化至 Shadow DOM，見 js/file.js） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<input type="file" id="fileInput" style="display: none" accept=".md,.txt,.markdown">

<header>
    <div class="logo-group">
        <div class="logo">
            <svg viewBox="-450 -450 900 900">
                <path d="M 40 60 h 50 l -10 60 h 35 l 10 -60 h 40 l -10 60 h 35 l 10 -60 h 50 L 270 60 L 270 30 L 205 30 L 215 -30 L 270 -30 L 270 -60 L 270 -60 h -50 l 10 -60 h -35 l -10 60 h -40 l 10 -60 h -35 l -10 60 h -50 l -5 30 h 50 l -10 60 h 35 l 10 -60 h 40 l -10 60 h -40 h -35 h -50 l -5 30 Z M -320 320 q -33 0 -56.5 -23.5 T -400 240 v -480 q 0 -33 23.5 -56.5 T -320 -320 h 640 q 33 0 56.5 23.5 T 400 -240 v 480 q 0 33 -23.5 56.5 T 320 320 H -320 Z m 0 -80 h 640 v -480 H -320 v 480 Z m 0 0 v -480 v 480 Z m 60 -120 h 60 v -180 h 40 v 120 h 60 v -120 h 40 v 180 h 60 v -200 q 0 -17 -11.5 -28.5 T -40 -120 H -220 q -17 0 -28.5 11.5 T -260 -80 v 200 Z" />
            </svg>
        </div>
    </div>

    <div class="controls">
        <div class="url-stats" id="urlStats" onclick="toggleStats(event)" role="button" tabindex="0" aria-label="Character count">
            <div class="dot" id="sizeDot"></div>
            <span id="sizeText">0 chars</span>
        </div>
        <button class="icon-btn" onclick="toggleView()" aria-label="Toggle view">
            <span class="material-symbols-outlined" id="toggleIcon">computer</span>
        </button>
        <div class="dropdown">
            <button class="icon-btn" onclick="toggleMenu(event, 'fileMenu')" aria-label="File menu"><span class="material-symbols-outlined">save</span></button>
            <div class="dropdown-menu" id="fileMenu">
                <button class="dropdown-item" onclick="triggerUpload()">
                    <span class="material-symbols-outlined" style="font-size: 20px;">upload_file</span>
                    <span>Import</span>
                </button>
                <button class="dropdown-item" onclick="downloadFile()">
                    <span class="material-symbols-outlined" style="font-size: 20px;">save_alt</span>
                    <span>Export</span>
                </button>
                <button class="dropdown-item" onclick="window.print()">
                    <span class="material-symbols-outlined" style="font-size: 20px;">print</span>
                    <span>Print</span>
                </button>
            </div>
        </div>
        <div class="dropdown">
            <button class="icon-btn" onclick="toggleMenu(event, 'shareMenu')" aria-label="Share menu"><span class="material-symbols-outlined">share</span></button>
            <div class="dropdown-menu" id="shareMenu">
                <button class="dropdown-item" onclick="copyOriginalUrl()">
                    <span class="material-symbols-outlined" style="font-size: 20px;">link</span>
                    <span>Copy URL</span>
                </button>
                <button class="dropdown-item" onclick="shareUrl()">
                    <span class="material-symbols-outlined" style="font-size: 20px;">ios_share</span>
                    <span>Share</span>
                </button>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <section class="panel active" id="editorPanel">
        <div class="editor-container">
            <div id="editor-highlighting"></div>
            <textarea id="editor" spellcheck="false" placeholder="# MarkHash
- Type Markdown on the left, live preview on the right
- Content lives in the URL — copy the link to share
"></textarea>
        </div>
    </section>
    <section class="panel active" id="previewPanel">
        <div id="preview-container"><div id="preview" class="markdown-body"></div></div>
    </section>
</div>

<div id="toast"><span id="toastMsg"></span></div>

<script src="./js/file.js"></script>

</body>
</html>
